schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  RobinLab is a Rust + React stock and option trading tracker.
  Runtime: authenticated Mako Cloud API and durable scheduled job functions; Rust domain logic compiled to Wasm. Axum/SQLx/SQLite remain for tools, parity and explicit compute rollback.
  Frontend: TypeScript, React, Vite, Tailwind CSS, TanStack Query, authenticated MakoDB replication into RxDB/Dexie, and Wasm. Supabase is obsolete.
  Shared calculation logic belongs in crates/core when it affects portfolio, P&L, performance, splits, or option behavior.
  crates/core must stay wasm32-compatible and avoid host-only dependencies such as SQLx, Tokio, Reqwest, and PyO3.
  Frontend route-relative calls use the configured cloud function endpoint with owner JWT and stable retry IDs. There is no localhost API fallback or proxy. Exactly one Mako dispatcher owns scheduled imports.
  Validate code changes with cargo test plus frontend lint/build when relevant.

