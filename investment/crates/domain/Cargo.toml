[package]
name = "robinlab-domain"
version = "0.1.0"
edition = "2021"

# Pure server domain and immutable format. Host adapters live in src/db.
[dependencies]
robinlab-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
sha2 = "0.10"
thiserror = "2"
calamine = "0.26"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml = "0.31"

[features]
test-fixtures = []
